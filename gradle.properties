# Docora Gradle properties
#
# Memory: KSP2 runs inside the Gradle daemon (it is no longer a compiler plugin),
# so the daemon heap needs to be generous enough for Room + Hilt symbol processing.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# KSP2 incremental processing
ksp.incremental=true
ksp.incremental.intermodule=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
